<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TravelSmarter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            font-size: 1.5em;
            font-weight: 800;
            color: #1a2744;
            margin-bottom: 8px;
        }
        .logo span { color: #ff6b4a; }
        h2 {
            text-align: center;
            font-size: 1.25em;
            color: #1a2744;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ff6b4a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #e85a39; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .message {
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.92em;
            margin-bottom: 16px;
            display: none;
        }
        .message.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-size: 0.88em;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>

    <img height="1" width="1" style="display:none;" alt=""

    <!-- end Pinterest Tag -->
</head>
<body>
<div class="card">
    <div class="logo">✈️ <span>TravelSmarter</span></div>

    <!-- Step 1: Request reset -->
    <div id="step-request">
        <h2>Forgot your password?</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link.</p>
        <div id="msg-request" class="message"></div>
        <form id="request-form">
            <label for="req-email">Email address</label>
            <input type="email" id="req-email" placeholder="you@example.com" required>
            <button type="submit" class="btn" id="req-btn">Send Reset Link</button>
        </form>
        <a href="auth.html" class="back-link">← Back to Sign In</a>
    </div>

    <!-- Step 2: Set new password (shown when ?token= present) -->
    <div id="step-reset" style="display:none;">
        <h2>Set a new password</h2>
        <p class="subtitle">Choose a strong password with at least 8 characters.</p>
        <div id="msg-reset" class="message"></div>
        <form id="reset-form">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" placeholder="At least 8 characters" required minlength="8">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" placeholder="Repeat password" required minlength="8">
            <button type="submit" class="btn" id="reset-btn">Set New Password</button>
        </form>
        <a href="auth.html" class="back-link">← Back to Sign In</a>
    </div>
</div>

<script>
    const API_URL = 'https://api.travelsmarterapp.com';

    // Check if a reset token is in the URL
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token');
    if (resetToken) {
        document.getElementById('step-request').style.display = 'none';
        document.getElementById('step-reset').style.display = 'block';
    }

    // Step 1: Request reset link
    document.getElementById('request-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('req-email').value.trim();
        const btn = document.getElementById('req-btn');
        const msg = document.getElementById('msg-request');

        btn.disabled = true;
        btn.textContent = 'Sending…';
        msg.style.display = 'none';

        try {
            await fetch(`${API_URL}/api/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            msg.className = 'message success';
            msg.textContent = 'If that email is registered, a reset link is on its way. Check your inbox (and spam folder).';
            msg.style.display = 'block';
            document.getElementById('request-form').style.display = 'none';
        } catch (err) {
            msg.className = 'message error';
            msg.textContent = 'Something went wrong. Please try again.';
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        }
    });

    // Step 2: Set new password
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        const btn = document.getElementById('reset-btn');
        const msg = document.getElementById('msg-reset');

        msg.style.display = 'none';

        if (password !== confirm) {
            msg.className = 'message error';
            msg.textContent = 'Passwords do not match.';
            msg.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Saving…';

        try {
            const res = await fetch(`${API_URL}/api/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: resetToken, password })
            });
            const data = await res.json();
            if (data.success) {
                msg.className = 'message success';
                msg.textContent = 'Password updated! Redirecting to sign in…';
                msg.style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';
                setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
            } else {
                msg.className = 'message error';
                msg.textContent = data.message || 'Reset link is invalid or expired. Please request a new one.';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Set New Password';
            }
        } catch (err) {
            msg.className = 'message error';
            msg.textContent = 'Something went wrong. Please try again.';
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Set New Password';
        }
    });
</script>
</body>
</html>
